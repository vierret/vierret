<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">От идеи до работающей системы</title>
  <desc id="desc">Тёмная обложка с зелёными акцентами и геометрической схемой. Hardware, Software, Robotics.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
