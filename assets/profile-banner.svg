    </pattern>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#101b29"/>
      <stop offset="1" stop-color="#0b111b"/>
    </linearGradient>
    <linearGradient id="plate" x2="1" y2="1">
      <stop stop-color="#233f45"/>
      <stop offset="1" stop-color="#14232e"/>
